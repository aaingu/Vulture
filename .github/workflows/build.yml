name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / Minecraft ${{ matrix.minecraft }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        minecraft: ['26.2', '26.3']
        include:
          - os: macos-latest
            shell: bash
            gradle: ./gradlew
          - os: windows-latest
            shell: pwsh
            gradle: .\gradlew.bat

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests
        shell: ${{ matrix.shell }}
        run: ${{ matrix.gradle }} build -Pminecraft=${{ matrix.minecraft }}
